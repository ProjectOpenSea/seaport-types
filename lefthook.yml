# Install with `scripts/install-tools.sh && .tools/bin/lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: forge fmt
      glob: "*.sol"
      # forge fmt applies only exact paths from foundry.toml's [fmt] ignore
      # when given files, so repeat src/ here. Its source ships in the
      # deployed Seaport 1.6 bytecode and must not be reformatted.
      exclude:
        - "lib/**"
        - "src/**"
      run: forge fmt {staged_files}
      stage_fixed: true
    - name: biome
      glob: "*.{json,jsonc,md,yml,yaml}"
      exclude:
        - "lib/**"
      run: .tools/bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      exclude:
        - "lib/**"
      run: .tools/bin/taplo fmt {staged_files}
      stage_fixed: true
    - name: shfmt
      glob: "*.sh"
      run: .tools/bin/shfmt -w {staged_files}
      stage_fixed: true
