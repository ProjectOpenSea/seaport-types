name: Tag commit with YY-MM-DD-branch

on:
  push:
    branches:
      - main
      - dev

# One tag push per branch at a time. Runs can still start out of order, so the
# step below also skips any commit that is no longer the branch tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A second push to the branch on the same day moves the tag to the
      # newer commit.
      - name: Tag commit
        run: |
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA is no longer the tip of $GITHUB_REF_NAME ($tip); skipping."
            exit 0
          fi
          tag="$(date -u +%y-%m-%d)-${GITHUB_REF_NAME}"
          git tag --force "$tag"
          git push --force origin "refs/tags/$tag"
