name: Tag commit with YY-MM-DD-branch

on:
  push:
    branches:
      - main
      - dev

# Pushes to the same branch tag in order, so the newest commit keeps the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A second push to the branch on the same day moves the tag to the
      # newer commit.
      - name: Tag commit
        run: |
          tag="$(date -u +%y-%m-%d)-${GITHUB_REF_NAME}"
          git tag --force "$tag"
          git push --force origin "refs/tags/$tag"
